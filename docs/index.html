<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Apps Store - A collection of downloadable apps and softwares.">
  <meta name="theme-color" content="#c98a00">
  <title>My Apps Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="#/" class="brand">
        <span class="logo"><i class="fas fa-rocket"></i></span>
        <span>My Apps Store</span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="#/" data-link data-route="home">Home</a>
      </nav>
    </div>
  </header>

  <section class="hero" id="heroSection">
    <div class="container">
      <div class="hero-badge"><i class="fas fa-download"></i> Free downloads</div>
      <h1>My <span>Apps Store</span></h1>
      <p>Discover and download apps and softwares. Click a card to see screenshots and details.</p>
    </div>
  </section>

  <main id="app" class="app container" aria-live="polite"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">My Apps Store</div>
      <div class="footer-credit">
        Developed by <strong class="developer">Ahmed BOURAMDANE</strong>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <script src="static/apps-index.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
